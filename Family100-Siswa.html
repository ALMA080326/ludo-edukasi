<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5b2cff">
<title>FAMILY 100 — Panel Siswa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg1:#5b2cff; --bg2:#00c6ff; --bg3:#ff4fd8; --bg4:#ffb000;
  --ink:#18223b; --muted:#667085; --white:#fff;
  --red:#ff4d67; --blue:#3d6cff; --yellow:#ffb020; --green:#22c981; --purple:#a855f7;
  --gold:#ffd43b; --cyan:#20e6ff; --pink:#ff5fd2;
  --glass:rgba(255,255,255,.16);
  --shadow:0 22px 55px rgba(24,16,80,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  color:#fff;
  padding:16px;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 12%, rgba(255,255,255,.24) 0 2px, transparent 3px),
    radial-gradient(circle at 83% 18%, rgba(255,255,255,.20) 0 3px, transparent 4px),
    linear-gradient(135deg,var(--bg1) 0%,#7654ff 30%,var(--bg2) 62%,var(--bg3) 100%);
  background-size:auto,auto,auto;
  position:relative;
}
body::before,body::after{
  content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(2px);
  animation:floatBlob 10s ease-in-out infinite alternate;
}
body::before{width:420px;height:420px;left:-150px;top:25%;background:rgba(255,178,0,.18)}
body::after{width:520px;height:520px;right:-210px;bottom:-180px;background:rgba(32,230,255,.18);animation-delay:-4s}
@keyframes floatBlob{to{transform:translate(35px,-28px) scale(1.08)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
@keyframes pop{0%{transform:scale(.72);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,212,59,0)}50%{box-shadow:0 0 0 12px rgba(255,212,59,.12),0 0 35px rgba(255,212,59,.35)}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes scoreBounce{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes confettiFall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}
@keyframes ripple{to{transform:scale(5);opacity:0}}

.decor{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.decor span{position:absolute;display:block}
.star{font-size:28px;color:#fff;filter:drop-shadow(0 0 8px rgba(255,255,255,.75));animation:twinkle 2.8s ease-in-out infinite}
.star.s1{left:5%;top:10%}.star.s2{left:92%;top:8%;font-size:20px;animation-delay:.7s}
.star.s3{left:78%;top:45%;font-size:34px;animation-delay:1.3s}
.star.s4{left:13%;top:75%;font-size:18px;animation-delay:1.9s}
.bubble{border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);backdrop-filter:blur(4px);animation:drift 7s ease-in-out infinite}
.b1{width:90px;height:90px;left:3%;bottom:12%}.b2{width:45px;height:45px;right:12%;top:30%;animation-delay:-2s}.b3{width:130px;height:130px;right:2%;top:62%;animation-delay:-4s}

.container{max-width:1380px;margin:0 auto;position:relative;z-index:5}
.layar{display:none}.layar.aktif{display:block;animation:rise .55s ease both}

/* Landing */
.hero{
  min-height:calc(100vh - 32px);display:grid;grid-template-columns:1.03fr .97fr;gap:26px;
  align-items:center;padding:28px;
}
.hero-copy{
  position:relative;padding:38px 24px 38px 10px;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  box-shadow:0 10px 35px rgba(24,16,80,.18);font-weight:800;font-size:.82rem;letter-spacing:.5px;
  backdrop-filter:blur(10px);animation:pop .7s ease both;
}
.hero h1{
  font-size:clamp(3rem,7vw,6.5rem);line-height:.92;margin:20px 0 18px;font-weight:900;letter-spacing:-3px;
  background:linear-gradient(90deg,#fff,#ffe66d 35%,#fff 65%,#a8f4ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 12px 35px rgba(17,10,80,.25);
}
.hero h1 span{display:block;font-size:.43em;letter-spacing:0;margin-top:14px;color:#fff}
.hero-sub{font-size:1.05rem;line-height:1.8;max-width:650px;color:rgba(255,255,255,.9)}
.feature-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}
.feature-chip{
  padding:9px 13px;border-radius:14px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);font-size:.82rem;font-weight:700;
  box-shadow:0 8px 25px rgba(0,0,0,.08);animation:rise .7s ease both;
}
.feature-chip:nth-child(2){animation-delay:.08s}.feature-chip:nth-child(3){animation-delay:.16s}.feature-chip:nth-child(4){animation-delay:.24s}
.info-cara{
  max-width:720px;margin:22px 0;padding:20px 22px;border-radius:24px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
  box-shadow:var(--shadow);backdrop-filter:blur(14px);
}
.info-cara h3{font-size:1.05rem;color:#ffe66d;margin-bottom:12px}
.info-cara p{margin:7px 0;line-height:1.65;font-size:.9rem;color:rgba(255,255,255,.92)}
.info-cara p:last-child{color:#ffe66d!important}
.hero-art{
  position:relative;min-height:650px;display:flex;align-items:center;justify-content:center;
}
.hero-art::before{
  content:"";position:absolute;width:92%;height:78%;border-radius:42% 58% 55% 45%;
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.25);filter:blur(.2px);transform:rotate(-4deg);
}
.hero-image-wrap{
  position:relative;width:min(100%,720px);border-radius:38px;overflow:hidden;
  border:5px solid rgba(255,255,255,.45);box-shadow:0 30px 80px rgba(20,10,80,.42);
  transform:rotate(2deg);transition:.45s cubic-bezier(.2,.8,.2,1);
  animation:drift 6s ease-in-out infinite;
}
.hero-image-wrap:hover{transform:rotate(0) scale(1.025)}
.hero-image{display:block;width:100%;height:auto;object-fit:cover}
.hero-image-wrap::after{
  content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
  transform:translateX(-120%);animation:shine 5s ease-in-out infinite;
}
.floating-card{
  position:absolute;padding:12px 15px;border-radius:18px;background:#fff;color:var(--ink);font-weight:800;
  box-shadow:0 18px 35px rgba(24,16,80,.25);z-index:3;animation:drift 5s ease-in-out infinite;
}
.fc1{left:2%;top:12%}.fc2{right:0;top:22%;animation-delay:-1.5s}.fc3{left:8%;bottom:12%;animation-delay:-3s}
.play-btn{
  position:relative;overflow:hidden;border:0;cursor:pointer;padding:17px 30px;border-radius:20px;
  color:#3b2500;font-size:1.05rem;font-weight:900;background:linear-gradient(135deg,#ffe66d,#ffad1f);
  box-shadow:0 10px 0 #d47b00,0 20px 35px rgba(255,173,31,.28);
  transition:transform .18s,box-shadow .18s;will-change:transform;
}
.play-btn:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 0 #d47b00,0 26px 45px rgba(255,173,31,.35)}
.play-btn:active{transform:translateY(5px) scale(.98);box-shadow:0 4px 0 #d47b00,0 10px 20px rgba(255,173,31,.25)}
.ripple{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:ripple .6s linear;pointer-events:none}

/* Main game */
.game-head{
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin:8px 0 16px;
  padding:16px 18px;border-radius:26px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(16px);box-shadow:0 18px 45px rgba(24,16,80,.18);
}
.logo-mini{font-size:1.35rem;font-weight:900;white-space:nowrap}
.round-pill{
  justify-self:center;padding:10px 18px;border-radius:999px;color:#3b2500;font-weight:900;
  background:linear-gradient(135deg,#fff0a6,#ffd43b);box-shadow:0 8px 24px rgba(255,212,59,.22);
  animation:pulseGlow 3s ease-in-out infinite;
}
.sisa-pill{font-size:.82rem;font-weight:800;color:#fff;background:rgba(0,0,0,.15);padding:9px 12px;border-radius:12px}
.skor-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 18px}
.tim-kartu{
  position:relative;overflow:hidden;border-radius:22px;padding:14px 10px;text-align:center;cursor:pointer;
  color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  border:2px solid rgba(255,255,255,.12);border-top:5px solid transparent;
  box-shadow:0 14px 32px rgba(20,12,80,.17),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .25s,box-shadow .25s,border-color .25s;will-change:transform;
}
.tim-kartu::before{content:"";position:absolute;inset:-80% 30% auto -40%;height:140px;background:rgba(255,255,255,.12);transform:rotate(25deg)}
.tim-kartu:hover{transform:translateY(-7px) rotate(-.6deg);box-shadow:0 22px 45px rgba(20,12,80,.24)}
.tim-kartu.aktif{transform:translateY(-8px) scale(1.035);border-color:#ffe66d;box-shadow:0 0 0 3px rgba(255,230,109,.12),0 22px 50px rgba(255,212,59,.24)}
.tim-kartu.merah{border-top-color:var(--red)}.tim-kartu.biru{border-top-color:var(--blue)}
.tim-kartu.kuning{border-top-color:var(--yellow)}.tim-kartu.hijau{border-top-color:var(--green)}.tim-kartu.ungu{border-top-color:var(--purple)}
.tim-nama{font-weight:800;font-size:.82rem;letter-spacing:.4px}.tim-poin{font-size:1.85rem;font-weight:900;margin:3px 0}
.strike-container{display:flex;justify-content:center;gap:5px;margin-top:7px}
.strike{width:23px;height:23px;border-radius:8px;background:rgba(0,0,0,.18);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.75rem;transition:.2s}
.strike.x{background:var(--red);animation:shake .35s ease;box-shadow:0 0 15px rgba(255,77,103,.4)}
.papan{
  position:relative;overflow:hidden;background:rgba(255,255,255,.96);color:var(--ink);border-radius:30px;padding:22px;
  margin-bottom:16px;box-shadow:0 30px 70px rgba(20,12,80,.25);border:2px solid rgba(255,255,255,.7);
}
.papan::before{
  content:"✨";position:absolute;right:18px;top:12px;font-size:22px;animation:twinkle 2s infinite;
}
.pertanyaan{
  position:relative;overflow:hidden;font-size:1.3rem;font-weight:900;margin-bottom:16px;text-align:center;
  padding:19px 18px;color:#fff;border-radius:20px;
  background:linear-gradient(135deg,#5134ff,#9d48ff 55%,#ff4fd8);
  box-shadow:0 14px 30px rgba(96,55,255,.22);
}
.pertanyaan::after{content:"";position:absolute;top:-30%;left:-20%;width:40%;height:160%;background:rgba(255,255,255,.18);transform:rotate(20deg);animation:shine 4s infinite}
.jawaban-baris{
  display:flex;align-items:center;background:#f4f6ff;margin:9px 0;border-radius:16px;min-height:58px;overflow:hidden;
  box-shadow:0 5px 15px rgba(31,39,80,.07);border:2px solid transparent;transition:.25s;
}
.jawaban-baris:hover{transform:translateX(4px);border-color:#d9d4ff;box-shadow:0 9px 22px rgba(31,39,80,.12)}
.nomor{
  width:52px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#283a86,#17255e);color:#fff;font-weight:900;font-size:1rem;
}
.jawaban{flex:1;padding:0 16px;font-size:.98rem;font-weight:800}.nilai{
  min-width:76px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#ffe66d,#ffb020);color:#493400;font-weight:900;
}
.tersembunyi{background:linear-gradient(135deg,#cbd1e5,#aeb6ce);color:transparent;position:relative}
.tersembunyi::after{content:'?';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-weight:900;font-size:1.15rem}
.terbuka{background:linear-gradient(90deg,#d7ffea,#fff7b0);animation:pop .45s ease-out;box-shadow:0 0 0 2px rgba(34,201,129,.15),0 9px 22px rgba(34,201,129,.15)}
.kontrol{
  display:grid;grid-template-columns:minmax(240px,1.3fr) repeat(3,auto);gap:10px;justify-content:center;margin:16px 0;
}
.input-jawab{
  min-width:0;padding:14px 16px;font-size:.98rem;border-radius:15px;border:3px solid rgba(255,255,255,.4);
  background:#fff;color:var(--ink);font-weight:700;box-shadow:0 10px 25px rgba(20,12,80,.12);outline:none;transition:.25s;
}
.input-jawab:focus{border-color:#ffe66d;box-shadow:0 0 0 4px rgba(255,230,109,.18),0 10px 25px rgba(20,12,80,.12)}
button{
  position:relative;overflow:hidden;padding:13px 16px;font-size:.88rem;border:0;border-radius:15px;cursor:pointer;
  font-weight:900;transition:transform .18s,box-shadow .18s;box-shadow:0 6px 0 rgba(0,0,0,.15),0 12px 20px rgba(20,12,80,.12);
}
button:hover{transform:translateY(-3px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn-hijau{background:linear-gradient(135deg,#20d989,#13b977);color:#fff}
.btn-biru{background:linear-gradient(135deg,#5274ff,#334de8);color:#fff}
.btn-merah{background:linear-gradient(135deg,#ff667b,#ef3655);color:#fff}
.btn-emas{background:linear-gradient(135deg,#ffe66d,#ffad1f);color:#3c2b00}
.btn-abu{background:linear-gradient(135deg,#718096,#4a5568);color:#fff}
.btn-cokelat{background:linear-gradient(135deg,#b86b36,#7f3e15);color:#fff}
.pemenang{
  text-align:center;font-size:clamp(1.4rem,4vw,2.3rem);margin-top:20px;display:none;padding:34px;
  background:linear-gradient(135deg,rgba(255,212,59,.24),rgba(255,79,216,.22),rgba(32,230,255,.2));
  border-radius:28px;border:3px solid #ffe66d;box-shadow:0 0 45px rgba(255,212,59,.25);
  animation:pop .6s ease both;
}
#namaPemenang{color:#ffe66d;font-weight:900;text-shadow:0 4px 18px rgba(255,212,59,.35)}
.popup-latar{
  position:fixed;inset:0;background:rgba(20,12,65,.72);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;
}
.popup-kotak{
  width:min(480px,100%);background:linear-gradient(160deg,#fff,#f5f2ff);border-radius:30px;padding:30px;color:var(--ink);
  text-align:center;box-shadow:0 35px 90px rgba(0,0,0,.38);border:4px solid rgba(255,255,255,.7);
  animation:pop .38s cubic-bezier(.2,.8,.2,1);
}
.popup-kotak h2{font-size:1.55rem;margin-bottom:8px;color:#5a35ee}
.popup-kotak p{color:#667085;line-height:1.6}.popup-tim{font-size:1.45rem;font-weight:900;margin:16px 0}
.popup-kotak .btn-emas{min-width:180px;font-size:1rem}
.sembunyi{display:none!important}
.confetti-piece{
  position:fixed;top:-20px;left:var(--left);width:10px;height:16px;z-index:10000;border-radius:3px;
  background:var(--c);animation:confettiFall var(--dur) linear forwards;transform:rotate(var(--r));pointer-events:none;
}
.footer-note{text-align:center;color:rgba(255,255,255,.65);font-size:.72rem;margin:14px 0 4px}

/* Responsive */
@media (max-width:1050px){
  .hero{grid-template-columns:1fr;padding:20px}.hero-copy{text-align:center;padding:28px 8px 0}.hero-sub{margin:auto}.feature-row{justify-content:center}
  .info-cara{margin:20px auto;text-align:left}.hero-art{min-height:480px}.hero-image-wrap{max-width:650px}
  .game-head{grid-template-columns:1fr;text-align:center}.round-pill{justify-self:center}
  .kontrol{grid-template-columns:1fr 1fr}
  .input-jawab{grid-column:1/-1}
}
@media (max-width:720px){
  body{padding:9px}.hero{min-height:auto;padding:14px 4px}.hero h1{font-size:3.35rem;letter-spacing:-2px}.hero-art{min-height:320px}
  .floating-card{font-size:.68rem;padding:8px 10px}.fc1{left:0}.fc2{right:0}.fc3{left:4%;bottom:4%}
  .skor-bar{grid-template-columns:repeat(2,1fr)}.tim-kartu:last-child{grid-column:1/-1;max-width:52%;justify-self:center;width:100%}
  .papan{padding:12px;border-radius:22px}.pertanyaan{font-size:1.05rem;padding:15px}.jawaban-baris{min-height:52px}.nomor{width:42px}.jawaban{padding:0 10px;font-size:.84rem}.nilai{min-width:58px}
  .kontrol{grid-template-columns:1fr 1fr}.kontrol button{font-size:.78rem;padding:12px 8px}.input-jawab{grid-column:1/-1}
  .info-cara p{font-size:.82rem}.logo-mini{font-size:1.1rem}
}
@media (max-width:430px){
  .hero h1{font-size:2.75rem}.hero-image-wrap{border-width:3px}.feature-chip{font-size:.72rem}.skor-bar{gap:8px}
  .tim-kartu{padding:11px 7px}.tim-poin{font-size:1.55rem}.kontrol{grid-template-columns:1fr}.input-jawab{grid-column:auto}
  .tim-kartu:last-child{max-width:none}.game-head{padding:12px}.round-pill{font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}


/* === PANEL GURU + PANEL SISWA === */
.panel-guru-label{grid-column:1/-1;width:100%;font-weight:900;color:#20e6ff;font-size:.9rem;padding:2px 0 4px}


/* === NETWORK HP -> HP === */
#networkGuru{margin:14px auto 0;max-width:1100px;padding:14px;border-radius:18px;background:rgba(8,14,30,.88);border:1px solid rgba(255,255,255,.13);box-shadow:0 10px 30px rgba(0,0,0,.2)}
#networkGuru .ng-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
#networkGuru .ng-title{font-weight:900;color:#fff;font-size:1.05rem}.ng-sub{color:#aab4ca;font-size:.82rem;margin-top:3px}
.ng-actions{display:flex;gap:8px;flex-wrap:wrap}.ng-actions button,.ng-answer{border:0;border-radius:12px;font-weight:900;cursor:pointer}
.ng-actions button{padding:10px 13px}.ng-create{background:#20e6ff;color:#07111d}.ng-copy{background:#ffd43b;color:#151515}.ng-disconnect{background:#ff526d;color:#fff}
.ng-room{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:#111a30;color:#fff}.ng-room b{font-size:1.35rem;letter-spacing:.18em;color:#55efff}.ng-status{margin-top:8px;font-size:.82rem;color:#aab4ca}.ng-answer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.ng-answer{min-height:55px;padding:8px;text-align:left;background:#151d31;color:#fff;border:1px solid rgba(255,255,255,.12);transition:.15s}.ng-answer:hover{transform:translateY(-2px);background:#243252}.ng-answer.open{background:#173d32;color:#83f7c0;opacity:.65}.ng-answer:disabled{cursor:not-allowed}.ng-num{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:8px;background:#293650;margin-right:6px}.ng-note{margin-top:9px;color:#9da9c0;font-size:.8rem}
.input-jawab,.btn-hijau{display:none!important}
@media(max-width:800px){.ng-answer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;z-index:10001;background:#111a30;color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ng-status.ok{color:#63f2a5}.ng-status.bad{color:#ff8a9b}
.ng-pts{color:#ffd43b;font-weight:900}
.ng-answer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#ngAnswerPanel{margin:14px auto 0;max-width:1100px;padding:14px;border-radius:18px;background:rgba(8,14,30,.88);border:1px solid rgba(255,255,255,.13)}

body.siswa .tim-kartu{cursor:default}body.siswa .tim-kartu:hover{transform:none}body.siswa .tim-kartu.aktif:hover{transform:translateY(-8px) scale(1.035)}
.tim-kartu.gugur{opacity:.45;filter:grayscale(.75)}
#connPill{position:fixed;top:10px;right:10px;z-index:9500;padding:8px 13px;border-radius:999px;font-weight:900;font-size:.78rem;background:rgba(10,16,34,.88);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.3)}

    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left - 9) + 'px';
    r.style.top = (e.clientY - rect.top - 9) + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });

  // Animate score changes without touching the original scoring logic.
  document.querySelectorAll('.tim-poin').forEach(el => {
    new MutationObserver(() => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = 'scoreBounce .42s ease';
    }).observe(el, {childList:true, characterData:true, subtree:true});
  });

  // Add a tiny celebration when an answer is revealed.
  const answers = document.getElementById('daftarJawaban');
  if (answers) {
    new MutationObserver(() => {
      answers.querySelectorAll('.terbuka').forEach(el => {
        if (el.dataset.fx) return;
        el.dataset.fx = '1';
        el.animate(
          [{transform:'scale(.94)'},{transform:'scale(1.025)'},{transform:'scale(1)'}],
          {duration:450,easing:'cubic-bezier(.2,.8,.2,1)'}
        );
      });
    }).observe(answers, {subtree:true, attributes:true, attributeFilter:['class']});
  }

  // Winner celebration.
  const winner = document.getElementById('pemenang');
  if (winner) {
    new MutationObserver(() => {
      if (getComputedStyle(winner).display !== 'none') launchConfetti(70);
    }).observe(winner, {attributes:true, attributeFilter:['style','class']});
  }

  function launchConfetti(count=50){
    for(let i=0;i<count;i++){
      const c=document.createElement('span');
      c.className='confetti-piece';
      c.style.setProperty('--left', Math.random()*100+'vw');
      c.style.setProperty('--x', (Math.random()*240-120)+'px');
      c.style.setProperty('--dur', (2.2+Math.random()*2.4)+'s');
      c.style.setProperty('--r', (Math.random()*180-90)+'deg');
      c.style.setProperty('--c', ['#ff4d67','#3d6cff','#ffd43b','#22c981','#a855f7','#20e6ff','#ff5fd2'][i%7]);
      c.style.width=(6+Math.random()*7)+'px';
      c.style.height=(9+Math.random()*10)+'px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    }
  }
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* =========================================================
   PANEL SISWA — hanya MENERIMA data dari Firebase Realtime Database.
   Listener:  /rooms/KODE_RUANG  (.on('value') = onValue)
   ========================================================= */
const NG_ROOT = 'rooms', NG_SAVED = 'family100_siswa_room';
const NAMA_TIM = ["🔴 MERAH","🔵 BIRU","🟡 KUNING","🟢 HIJAU","🟣 UNGU"];
let db = null, roomRef = null, roomCode = '', prev = null, online = false, questionKey = null, bannerTimer = null;

function $(id){ return document.getElementById(id); }
function suara(id){ const a = $(id); if(!a) return; try{ a.currentTime = 0; const p = a.play(); if(p && p.catch) p.catch(() => {}); }catch(e){} }
/* browser HP butuh 1x sentuhan sebelum suara boleh diputar */
document.addEventListener('pointerdown', () => {
  ['audioBenar','audioSalah'].forEach(id => { const a = $(id); if(!a) return; a.muted = true; try{ const p = a.play(); if(p && p.then) p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); }catch(e){ a.muted = false; } });
}, { once: true });

/* ---------- status koneksi ---------- */
function showConn(){
  const p = $('connPill'), bar = $('offlineBar');
  if(!roomRef){ p.style.display = 'none'; return; }
  p.style.display = '';
  if(online){ p.textContent = '🟢 TERHUBUNG • ' + roomCode; p.className = 'ok'; bar.style.display = 'none'; }
  else { p.textContent = '🔴 TERPUTUS'; p.className = 'bad'; bar.style.display = 'block'; }
}
function banner(text){
  const b = $('banner'); b.textContent = text; b.classList.add('show');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('show'), 2200);
}
function flashX(){
  const x = $('bigX'); x.classList.remove('go'); void x.offsetWidth; x.classList.add('go');
}

/* ---------- Firebase ---------- */
function configOk(){
  const c = window.FAMILY100_FIREBASE_CONFIG;
  if(!c || !c.apiKey || !c.databaseURL) return false;
  return !/\.\.\.|ISI_|GANTI/i.test(c.apiKey + c.databaseURL + c.projectId);
}
async function initFirebase(){
  if(db) return;
  if(typeof firebase === 'undefined') throw new Error('Firebase SDK gagal dimuat. Cek internet.');
  if(!configOk()) throw new Error('firebase-config.js belum diisi.');
  if(!firebase.apps.length) firebase.initializeApp(window.FAMILY100_FIREBASE_CONFIG);
  const auth = firebase.auth();
  const user = await new Promise(res => { const off = auth.onAuthStateChanged(u => { off(); res(u); }); });
  if(!user) await auth.signInAnonymously();
  db = firebase.database();
  db.ref('.info/connected').on('value', s => { online = !!s.val(); showConn(); });
}
function joinMsg(t, bad){ const e = $('joinStatus'); e.textContent = t; e.style.color = bad ? '#d92d4b' : '#667085'; }

async function joinRoom(autoCode){
  const code = (typeof autoCode === 'string' ? autoCode : $('code').value).trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)){ joinMsg('Kode ruang harus 6 huruf/angka.', true); return; }
  joinMsg('Menghubungkan…');
  try{
    await initFirebase();
    const ref = db.ref(NG_ROOT + '/' + code);
    const snap = await ref.get();
    if(!snap.exists()){
      try{ localStorage.removeItem(NG_SAVED); }catch(e){}
      joinMsg('❌ Kode ruang tidak ditemukan.', true); return;
    }
    if(roomRef) roomRef.off();
    roomRef = ref; roomCode = code; prev = null; questionKey = null;
    try{ localStorage.setItem(NG_SAVED, code); }catch(e){}
    $('joinScreen').style.display = 'none';
    $('layarMain').classList.add('aktif');
    showConn();
    roomRef.on('value', s => {
      if(!s.exists()){ $('pertanyaan').textContent = '⛔ Ruang sudah ditutup oleh guru.'; return; }
      render(s.val());
    }, err => { banner('🔴 ' + err.message); });
  }catch(e){ joinMsg('🔴 Gagal terhubung: ' + e.message, true); }
}
function keluarRuang(){
  if(roomRef) roomRef.off();
  roomRef = null; roomCode = ''; prev = null; questionKey = null;
  try{ localStorage.removeItem(NG_SAVED); }catch(e){}
  $('layarMain').classList.remove('aktif');
  $('joinScreen').style.display = '';
  $('code').value = ''; joinMsg('');
  showConn();
}

/* ---------- tampilan ---------- */
function arr5(a, f){ return [0,1,2,3,4].map(i => f((a || [])[i])); }
function render(st){
  const first = prev === null;
  const scores = arr5(st.scores, v => v || 0);
  const strikes = arr5(st.strikes, v => v || 0);
  const elim = arr5(st.eliminatedTeams, v => !!v);
  const opened = Array.isArray(st.openedAnswers) ? st.openedAnswers.map(v => !!v) : [];
  const answers = Array.isArray(st.answers) ? st.answers : [];
  const active = st.activeTeam || 0;
  const waiting = st.gameStatus === 'waiting';

  $('namaBabak').textContent = st.currentRound || '';
  $('pertanyaan').textContent = waiting ? '⏳ Menunggu guru memulai permainan…' : (st.questionText || '');

  /* baris jawaban: dibangun ulang hanya kalau soal berganti */
  const key = st.currentQuestion + '|' + answers.length;
  const newQuestion = key !== questionKey;
  if(newQuestion){
    questionKey = key;
    const daftar = $('daftarJawaban'); daftar.innerHTML = '';
    for(let i = 0; i < answers.length; i++){
      const row = document.createElement('div'); row.className = 'jawaban-baris';
      row.innerHTML = '<div class="nomor">' + (i + 1) + '</div><div class="jawaban tersembunyi" id="jwb-' + i + '"></div><div class="nilai" id="nil-' + i + '"></div>';
      daftar.appendChild(row);
    }
    if(!first && !waiting) banner((st.currentRound || '') + ' • Soal ' + ((st.currentQuestion || 0) + 1));
  }
  let bukaBaru = false;
  answers.forEach((a, i) => {
    const el = $('jwb-' + i), nil = $('nil-' + i); if(!el) return;
    nil.textContent = a.points;
    if(opened[i]){
      if(!el.classList.contains('terbuka')){ bukaBaru = true; }
      el.textContent = a.text || '';
      el.classList.remove('tersembunyi'); el.classList.add('terbuka');
    } else {
      el.textContent = ''; el.classList.remove('terbuka'); el.classList.add('tersembunyi');
    }
  });
  const sisa = opened.filter(v => !v).length;
  $('infoSisa').textContent = sisa > 0 ? '👁️ Jawaban tersisa: ' + sisa : '✅ Semua jawaban sudah terbuka!';

  /* tim, skor, strike */
  let strikeBaru = false;
  for(let t = 0; t < 5; t++){
    $('poin' + t).textContent = scores[t];
    for(let x = 1; x <= 3; x++) $('s' + t + '-' + x).classList.toggle('x', strikes[t] >= x);
    $('tim' + t).classList.toggle('aktif', t === active);
    $('tim' + t).classList.toggle('gugur', elim[t]);
    if(prev && strikes[t] > prev.strikes[t]) strikeBaru = true;
  }
  if(prev && !newQuestion && active !== prev.active) banner('⬆️ GILIRAN TIM ' + NAMA_TIM[active]);

  /* pemenang */
  const w = $('pemenang');
  if(st.winner){ $('namaPemenang').textContent = st.winner; if(w.style.display !== 'block') w.style.display = 'block'; }
  else w.style.display = 'none';

  /* suara & animasi hanya untuk perubahan baru (bukan saat pertama kali tersambung) */
  if(!first){
    if(strikeBaru){ flashX(); suara('audioSalah'); }
    else if(bukaBaru && !newQuestion){ suara('audioBenar'); }
  }
  prev = { strikes, active };
}

window.addEventListener('online', () => { online = true; showConn(); });
window.addEventListener('offline', () => { online = false; showConn(); });
window.addEventListener('load', () => {
  $('code').addEventListener('keydown', e => { if(e.key === 'Enter') joinRoom(); });
  if(!configOk()){ joinMsg('⚠️ firebase-config.js belum diisi (lihat FIREBASE-SETUP.txt).', true); return; }
  let saved = ''; try{ saved = localStorage.getItem(NG_SAVED) || ''; }catch(e){}
  if(saved){ $('code').value = saved; joinRoom(saved); }
});
</script>

</body>
</html>
