<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Generator Ludo Edukasi</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Fredoka', sans-serif; }
body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; color: #1e3a8a;
}
.wrap { max-width: 1200px; margin: 0 auto; }
header {
    text-align: center; color: white; margin-bottom: 25px;
    padding: 25px; background: rgba(255,255,255,0.1);
    border-radius: 25px; backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.2);
}
header h1 { font-size: 2.3rem; margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
header p { opacity: 0.9; font-size: 1rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

.card {
    background: white; border-radius: 20px; padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.card h2 {
    font-size: 1.2rem; color: #1e5eff; margin-bottom: 15px;
    padding-bottom: 10px; border-bottom: 3px dashed #e0e0e0;
    display: flex; align-items: center; gap: 8px;
}
label {
    display: block; font-weight: 700; margin-bottom: 6px;
    font-size: 0.9rem; color: #1e3a8a;
}
input[type="text"], textarea, select {
    width: 100%; padding: 12px 15px; border: 3px solid #e0e0e0;
    border-radius: 12px; font-family: 'Fredoka', sans-serif;
    font-size: 0.95rem; margin-bottom: 15px; outline: none;
    transition: all 0.2s;
}
input[type="text"]:focus, textarea:focus, select:focus {
    border-color: #1e5eff; box-shadow: 0 0 0 4px rgba(30,94,255,0.15);
}
textarea { resize: vertical; min-height: 80px; }

.btn {
    padding: 12px 20px; border: 3px solid transparent; border-radius: 12px;
    font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.95rem;
    cursor: pointer; transition: all 0.15s; box-shadow: 0 5px 0 rgba(0,0,0,0.2);
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
.btn-primary { background: #1e5eff; color: white; }
.btn-primary:hover { background: #0f3bb3; }
.btn-success { background: #4CAF50; color: white; }
.btn-success:hover { background: #2E7D32; }
.btn-danger { background: #ff4d4d; color: white; padding: 8px 12px; font-size: 0.85rem; }
.btn-danger:hover { background: #b30000; }
.btn-warning { background: #ff9900; color: white; }
.btn-warning:hover { background: #cc7a00; }
.btn-secondary { background: #9e9e9e; color: white; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

.group-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
.group-tab {
    padding: 10px 15px; border-radius: 12px; cursor: pointer;
    font-weight: 700; font-size: 0.85rem; border: 3px solid #e0e0e0;
    background: white; transition: all 0.2s; color: #555;
}
.group-tab.active { border-color: #1e5eff; background: #1e5eff; color: white; transform: translateY(-2px); box-shadow: 0 5px 0 #0f3bb3; }
.group-tab.red.active { background: #ff4d4d; border-color: #ff4d4d; box-shadow: 0 5px 0 #b30000; }
.group-tab.blue.active { background: #4d79ff; border-color: #4d79ff; box-shadow: 0 5px 0 #0033cc; }
.group-tab.yellow.active { background: #ffcc00; border-color: #ffcc00; box-shadow: 0 5px 0 #cc9900; color: #333; }
.group-tab.green.active { background: #4CAF50; border-color: #4CAF50; box-shadow: 0 5px 0 #2E7D32; }
.group-tab.purple.active { background: #b366ff; border-color: #b366ff; box-shadow: 0 5px 0 #6600cc; }

.question-item {
    background: #f8f9ff; border: 2px solid #e0e0e0; border-radius: 15px;
    padding: 15px; margin-bottom: 12px; position: relative;
}
.question-item .q-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
}
.question-item .q-number {
    background: #1e5eff; color: white; padding: 4px 12px;
    border-radius: 10px; font-weight: 700; font-size: 0.8rem;
}
.option-row {
    display: grid; grid-template-columns: 30px 1fr 30px; gap: 8px;
    align-items: center; margin-bottom: 6px;
}
.option-letter {
    width: 30px; height: 30px; background: #e0e0e0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; color: #555;
}
.option-row input { margin-bottom: 0; padding: 8px 12px; font-size: 0.9rem; }
.correct-radio { cursor: pointer; width: 24px; height: 24px; }
.correct-radio:checked { accent-color: #4CAF50; }

.stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    margin-bottom: 20px;
}
.stat-box {
    background: white; border-radius: 15px; padding: 15px;
    text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    border-top: 5px solid;
}
.stat-box.red { border-color: #ff4d4d; }
.stat-box.blue { border-color: #4d79ff; }
.stat-box.yellow { border-color: #ffcc00; }
.stat-box.green { border-color: #4CAF50; }
.stat-box.purple { border-color: #b366ff; }
.stat-box .num { font-size: 1.8rem; font-weight: 800; color: #1e3a8a; }
.stat-box .label { font-size: 0.75rem; font-weight: 700; color: #888; text-transform: uppercase; }

.empty-state {
    text-align: center; padding: 30px; color: #999;
    background: #f8f9ff; border-radius: 15px; border: 2px dashed #e0e0e0;
}

.export-bar {
    position: sticky; bottom: 0; background: white; padding: 20px;
    border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
    display: flex; gap: 15px; justify-content: space-between;
    align-items: center; margin-top: 20px; flex-wrap: wrap;
}
.export-bar .info { font-weight: 700; color: #1e3a8a; }

.toast {
    position: fixed; top: 20px; right: 20px; background: #4CAF50;
    color: white; padding: 15px 25px; border-radius: 15px;
    font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transform: translateX(400px); transition: transform 0.3s;
    z-index: 9999; border: 3px solid white;
}
.toast.show { transform: translateX(0); }
.toast.error { background: #ff4d4d; }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>🎲 Generator Ludo Edukasi</h1>
        <p>Isi soal & pengaturan, lalu download file HTML siap pakai!</p>
    </header>

    <!-- SETTINGS -->
    <div class="card" style="margin-bottom:20px;">
        <h2>⚙️ Pengaturan Umum</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div>
                <label>Judul Game</label>
                <input type="text" id="gameTitle" value="Ludo Edukasi" placeholder="Contoh: Ludo Edukasi">
            </div>
            <div>
                <label>Subjudul</label>
                <input type="text" id="gameSubtitle" value="Berpikir Komputasional · Permainan Kelompok">
            </div>
            <div>
                <label>Waktu Menjawab (detik)</label>
                <input type="text" id="timerSec" value="60">
            </div>
            <div>
                <label>Jumlah Juara yang Selesai Dulu (permainan berakhir)</label>
                <select id="winnersNeeded">
                    <option value="3" selected>3 kelompok</option>
                    <option value="2">2 kelompok</option>
                    <option value="1">1 kelompok</option>
                    <option value="5">Semua (5 kelompok)</option>
                </select>
            </div>
        </div>
        <label>Kata Motivasi Benar (pisah dengan | )</label>
        <textarea id="correctWords" placeholder="Pisahkan dengan tanda | ">Luar biasa! Kalian hebat!|Keren banget!|Mantap!|Hebat sekali!|Top! Lanjutkan!</textarea>
        <label>Kata Motivasi Salah (pisah dengan | )</label>
        <textarea id="wrongWords" placeholder="Pisahkan dengan tanda | ">Jangan menyerah, coba lagi!|Tetap semangat!|Belajar dari kesalahan!|Ayo coba lagi!|Tidak apa-apa, terus berlatih!</textarea>
    </div>

    <!-- STATS -->
    <div class="stats" id="statsBox"></div>

    <!-- GROUP + QUESTIONS -->
    <div class="grid">
        <div class="card">
            <h2>👥 Daftar Kelompok</h2>
            <div id="groupList"></div>
        </div>

        <div class="card">
            <h2>❓ Kelola Soal</h2>
            <div class="group-tabs" id="groupTabs"></div>
            <div id="questionList"></div>
            <div class="btn-row">
                <button class="btn btn-success" onclick="addQuestion()">➕ Tambah Soal</button>
                <button class="btn btn-warning" onclick="clearQuestions()">🗑️ Hapus Semua Soal Kelompok Ini</button>
            </div>
        </div>
    </div>

    <!-- EXPORT BAR -->
    <div class="export-bar">
        <div class="info" id="exportInfo">Total Soal: 0</div>
        <div class="btn-row" style="margin:0;">
            <button class="btn btn-secondary" onclick="saveLocal()">💾 Simpan Draft</button>
            <button class="btn btn-warning" onclick="loadLocal()">📂 Muat Draft</button>
            <button class="btn btn-primary" onclick="downloadHTML()">⬇️ Download Game (.html)</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Berhasil!</div>

<script>
// ============================================================
// STATE
// ============================================================
const COLORS = ['red', 'blue', 'yellow', 'green', 'purple'];
const COLOR_NAMES = { red: 'MERAH', blue: 'BIRU', yellow: 'KUNING', green: 'HIJAU', purple: 'UNGU' };

let state = {
    groups: {},
    activeGroup: 'red'
};

COLORS.forEach(c => {
    state.groups[c] = {
        name: 'KELOMPOK ' + (COLORS.indexOf(c) + 1),
        colorName: COLOR_NAMES[c],
        questions: []
    };
});

// ============================================================
// RENDER
// ============================================================
function render() {
    renderStats();
    renderGroups();
    renderTabs();
    renderQuestions();
    updateExportInfo();
}

function renderStats() {
    const box = document.getElementById('statsBox');
    box.innerHTML = COLORS.map(c => {
        const count = state.groups[c].questions.length;
        return `<div class="stat-box ${c}">
            <div class="num">${count}</div>
            <div class="label">${state.groups[c].name}</div>
        </div>`;
    }).join('');
}

function renderGroups() {
    const list = document.getElementById('groupList');
    list.innerHTML = COLORS.map(c => `
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
            <div style="width:40px; height:40px; border-radius:50%; background:${getColorHex(c)}; border:3px solid white; box-shadow:0 4px 0 rgba(0,0,0,0.2);"></div>
            <input type="text" value="${escapeHtml(state.groups[c].name)}" 
                onchange="updateGroupName('${c}', this.value)" 
                style="margin:0; flex:1;">
            <span style="font-weight:700; color:#888; font-size:0.85rem; white-space:nowrap;">${state.groups[c].questions.length} soal</span>
        </div>
    `).join('');
}

function renderTabs() {
    const tabs = document.getElementById('groupTabs');
    tabs.innerHTML = COLORS.map(c => `
        <div class="group-tab ${c} ${state.activeGroup === c ? 'active' : ''}" 
             onclick="switchGroup('${c}')">
            ${state.groups[c].name.split(' ')[1] || c.toUpperCase()}
        </div>
    `).join('');
}

function renderQuestions() {
    const list = document.getElementById('questionList');
    const qs = state.groups[state.activeGroup].questions;
    if (qs.length === 0) {
        list.innerHTML = `<div class="empty-state">
            Belum ada soal untuk kelompok ini.<br>Klik <strong>"➕ Tambah Soal"</strong> untuk mulai.
        </div>`;
        return;
    }
    list.innerHTML = qs.map((q, idx) => `
        <div class="question-item">
            <div class="q-header">
                <span class="q-number">Soal #${idx + 1}</span>
                <button class="btn btn-danger" onclick="deleteQuestion(${idx})">🗑️ Hapus</button>
            </div>
            <label>Pertanyaan</label>
            <textarea onchange="updateQuestion(${idx}, 'q', this.value)" 
                placeholder="Tulis pertanyaan...">${escapeHtml(q.q)}</textarea>
            <label>Pilihan Jawaban (klik bulatan hijau = jawaban benar)</label>
            ${q.opts.map((opt, oi) => `
                <div class="option-row">
                    <div class="option-letter">${String.fromCharCode(65 + oi)}</div>
                    <input type="text" value="${escapeHtml(opt)}" 
                        onchange="updateOption(${idx}, ${oi}, this.value)" 
                        placeholder="Pilihan ${String.fromCharCode(65 + oi)}">
                    <input type="radio" class="correct-radio" name="correct-${idx}" 
                        ${q.ans === oi ? 'checked' : ''} 
                        onchange="setCorrect(${idx}, ${oi})">
                </div>
            `).join('')}
        </div>
    `).join('');
}

function updateExportInfo() {
    const total = COLORS.reduce((sum, c) => sum + state.groups[c].questions.length, 0);
    document.getElementById('exportInfo').textContent = `📊 Total Soal: ${total}`;
}

// ============================================================
// ACTIONS
// ============================================================
function updateGroupName(color, name) {
    state.groups[color].name = name;
    render();
}

function switchGroup(color) {
    state.activeGroup = color;
    render();
}

function addQuestion() {
    state.groups[state.activeGroup].questions.push({
        q: '',
        opts: ['', '', '', ''],
        ans: 0
    });
    render();
    // Scroll ke bawah
    setTimeout(() => {
        const items = document.querySelectorAll('.question-item');
        items[items.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
}

function deleteQuestion(idx) {
    if (!confirm('Hapus soal ini?')) return;
    state.groups[state.activeGroup].questions.splice(idx, 1);
    render();
}

function updateQuestion(idx, field, value) {
    state.groups[state.activeGroup].questions[idx][field] = value;
}

function updateOption(idx, optIdx, value) {
    state.groups[state.activeGroup].questions[idx].opts[optIdx] = value;
}

function setCorrect(idx, optIdx) {
    state.groups[state.activeGroup].questions[idx].ans = optIdx;
}

function clearQuestions() {
    if (!confirm('Hapus SEMUA soal untuk kelompok ini?')) return;
    state.groups[state.activeGroup].questions = [];
    render();
}

// ============================================================
// UTILS
// ============================================================
function getColorHex(c) {
    return { red:'#ff4d4d', blue:'#4d79ff', yellow:'#ffcc00', green:'#4CAF50', purple:'#b366ff' }[c];
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
}

function escapeJs(s) {
    return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
}

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 2500);
}

// ============================================================
// SAVE / LOAD DRAFT
// ============================================================
function saveLocal() {
    try {
        localStorage.setItem('ludoEdukasiGenerator', JSON.stringify(state));
        showToast('💾 Draft berhasil disimpan!');
    } catch(e) {
        showToast('Gagal menyimpan draft', true);
    }
}

function loadLocal() {
    try {
        const data = localStorage.getItem('ludoEdukasiGenerator');
        if (!data) { showToast('Tidak ada draft tersimpan', true); return; }
        state = JSON.parse(data);
        // Pastikan semua grup ada
        COLORS.forEach(c => { if (!state.groups[c]) state.groups[c] = { name: 'KELOMPOK ' + (COLORS.indexOf(c)+1), questions: [] }; });
        render();
        showToast('📂 Draft berhasil dimuat!');
    } catch(e) {
        showToast('Gagal memuat draft', true);
    }
}

// ============================================================
// DOWNLOAD GENERATOR
// ============================================================
function downloadHTML() {
    // Validasi
    let total = 0;
    let allValid = true;
    COLORS.forEach(c => {
        state.groups[c].questions.forEach(q => {
            total++;
            if (!q.q.trim() || q.opts.some(o => !o.trim())) allValid = false;
        });
    });
    if (total === 0) { showToast('Belum ada soal! Tambahkan minimal 1 soal.', true); return; }
    if (!allValid) { showToast('Ada soal yang kosong. Mohon lengkapi!', true); return; }
    if (!confirm(`Download game dengan ${total} soal? File akan disimpan sebagai index.html`)) return;

    const html = buildGameHTML();
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ Game berhasil di-download!');
}

function buildGameHTML() {
    const gameTitle = document.getElementById('gameTitle').value || 'Ludo Edukasi';
    const gameSubtitle = document.getElementById('gameSubtitle').value || '';
    const timerSec = parseInt(document.getElementById('timerSec').value) || 60;
    const winnersNeeded = parseInt(document.getElementById('winnersNeeded').value) || 3;
    const correctWords = document.getElementById('correctWords').value.split('|').map(s => s.trim()).filter(Boolean);
    const wrongWords = document.getElementById('wrongWords').value.split('|').map(s => s.trim()).filter(Boolean);

    // Build groupsData JSON string
    const groupsDataStr = COLORS.map(c => {
        const g = state.groups[c];
        const questions = g.questions.map(q => ({
            q: q.q,
            opts: q.opts,
            ans: q.ans
        }));
        return `${c}: { name: '${escapeJs(g.name)}', color: '${c}', questions: ${JSON.stringify(questions)} }`;
    }).join(',\n            ');

    const correctWordsStr = JSON.stringify(correctWords.length ? correctWords : ['Luar biasa!','Hebat!','Mantap!']);
    const wrongWordsStr = JSON.stringify(wrongWords.length ? wrongWords : ['Coba lagi!','Tetap semangat!','Belajar dari kesalahan!']);

    // ============== TEMPLATE HTML ==============
    return `<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(gameTitle)}</title>
