<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survey 100 — Siswa</title><style>
:root{--bg:#07152e;--card:#10244a;--card2:#173263;--ink:#f7fbff;--muted:#b9c8e5;--cyan:#28d7ff;--yellow:#ffd43b;--green:#20d989;--red:#ff5570;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#2549a0 0,#07152e 42%),linear-gradient(135deg,#07152e,#12082e);min-height:100vh}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{padding:18px 0 8px;text-align:center}.hero h1{margin:0;font-size:clamp(1.7rem,5vw,3rem);font-weight:950;background:linear-gradient(90deg,#fff,#ffd43b,#28d7ff);-webkit-background-clip:text;color:transparent}.hero p{margin:6px 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,rgba(23,50,99,.96),rgba(11,29,61,.96));border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.24)}.wide{grid-column:1/-1}.label{font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#9feeff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid #42609a;background:#07152e;color:#fff;outline:0}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(40,215,255,.12)}.btn{padding:12px 16px;border-radius:14px;font-weight:900;color:#07152e;background:var(--cyan);box-shadow:0 8px 20px rgba(40,215,255,.18)}.btn.y{background:var(--yellow)}.btn.g{background:var(--green)}.btn.r{background:var(--red);color:#fff}.btn.p{background:var(--purple);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.room{font-size:2rem;letter-spacing:.22em;color:var(--yellow);font-weight:950}.status{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);color:var(--muted);margin-top:10px}.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.team{padding:12px;border-radius:16px;background:#0a1c3d;border:1px solid rgba(255,255,255,.1);text-align:center}.team strong{display:block;font-size:1.2rem}.score{font-size:1.5rem;font-weight:950;color:var(--yellow)}.round{display:inline-block;padding:8px 12px;border-radius:999px;background:#ffe16b;color:#332600;font-weight:950}.qbox{margin-top:12px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#4b32d8,#8b5cf6);font-size:clamp(1.05rem,2.5vw,1.5rem);font-weight:900}.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.ans{padding:12px;border-radius:15px;background:#091a39;border:1px solid rgba(255,255,255,.12);color:#fff;text-align:left}.ans.open{background:linear-gradient(135deg,#124e3d,#187c5c);border-color:#4af0b1}.ans b{color:var(--yellow);margin-right:7px}.timer{font-size:3rem;font-weight:950;text-align:center;color:var(--yellow);text-shadow:0 0 22px rgba(255,212,59,.25)}.note{color:var(--muted);font-size:.88rem;line-height:1.55}.hidden{display:none!important}.sub{font-weight:900;color:#fff}.choice{display:flex;gap:8px;align-items:center}.choice label{padding:10px 12px;background:#091a39;border-radius:12px;cursor:pointer}.choice input{accent-color:#28d7ff}.log{max-height:240px;overflow:auto;font-size:.85rem;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}th{color:var(--yellow)}@media(max-width:800px){.grid{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.wide{grid-column:auto}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="firebase-config.js"></script></head><body><div class="wrap"><header class="hero"><h1>🎯 SURVEY 100</h1><p>Algoritma Edition • PANEL SISWA</p></header><section id="join" class="card"><div class="label">Gabung permainan</div><input id="code" class="input" placeholder="Kode ruang" style="margin-top:10px"><input id="name" class="input" placeholder="Nama siswa" style="margin-top:10px"><div class="label" style="margin-top:14px">Pilih kelompok</div><div class="choice" style="flex-wrap:wrap;margin-top:8px"><label><input id="g0" type="radio" name="group" value="0"> Kelompok 1</label><label><input id="g1" type="radio" name="group" value="1"> Kelompok 2</label><label><input id="g2" type="radio" name="group" value="2"> Kelompok 3</label><label><input id="g3" type="radio" name="group" value="3"> Kelompok 4</label><label><input id="g4" type="radio" name="group" value="4"> Kelompok 5</label></div><button class="btn g" style="margin-top:14px" onclick="join()">🚀 GABUNG</button><div id="status" class="status">Siap.</div></section><section id="game" class="hidden"><div class="grid"><section class="card"><div class="label">Status</div><div id="round" class="round">MENUNGGU</div><div id="timer" class="timer">—</div><div id="score" class="score">0</div><div class="note">Poin kelompok Anda</div></section><section class="card"><div class="label">Pertanyaan</div><div id="question" class="qbox">Menunggu guru…</div><div id="mine" class="status">Belum mengirim jawaban</div></section><section class="card wide"><div class="label">Jawaban survei</div><div id="answers" class="answers"></div><div class="note" style="margin-top:10px">Jawaban dibuka oleh guru sesuai jalannya permainan.</div></section><section class="card wide"><div class="row"><input id="myanswer" class="input" placeholder="Tulis jawaban kelompok…"><button class="btn g" onclick="submit(document.getElementById('myanswer').value)">KIRIM JAWABAN</button><button id="rebut" class="btn r hidden" onclick="rebut()">⚡ REBUT!</button></div></section></div></section></div><script>const QUESTIONS=[{"r":1,"title":"BABAK 1 – PEMANASAN","q":"Ketika akan berangkat ke sekolah, kegiatan apa yang biasanya dilakukan secara berurutan?","a":[["Mandi",30],["Memakai seragam",25],["Sarapan",20],["Menyiapkan tas/buku",15],["Berangkat ke sekolah",10]],"note":"Konsep algoritma: langkah berurutan (sequence)."},{"r":1,"title":"BABAK 1 – PEMANASAN","q":"Saat ingin membuat mi instan, apa yang biasanya dilakukan terlebih dahulu?","a":[["Menyiapkan alat dan bahan",35],["Merebus air",30],["Membuka kemasan mi",15],["Menyiapkan bumbu",10],["Menyiapkan mangkuk",10]],"note":"Guru dapat bertanya: “Apa yang terjadi kalau kita memasukkan mi sebelum air mendidih?” Siswa mulai memahami bahwa urutan langkah memengaruhi hasil."},{"r":2,"title":"BABAK 2 – TANTANGAN CEPAT","q":"Ketika akan keluar rumah dan melihat langit mendung, apa yang biasanya kamu lakukan?","a":[["Membawa payung",40],["Mengecek prakiraan cuaca",25],["Tetap berangkat",15],["Menunggu hujan reda",10],["Membawa jas hujan",10]],"note":"Konsep: percabangan. Jika hujan → bawa payung. Jika tidak hujan → tidak perlu membawa payung."},{"r":2,"title":"BABAK 2 – TANTANGAN CEPAT","q":"Saat membeli makanan menggunakan uang Rp20.000, apa yang biasanya kamu pertimbangkan?","a":[["Harga makanan",40],["Uang yang tersedia",25],["Kebutuhan/keinginan",15],["Rasa makanan",10],["Kembalian",10]],"note":"Konsep: algoritma pengambilan keputusan."},{"r":2,"title":"BABAK 2 – TANTANGAN CEPAT","q":"Saat login ke akun media sosial tetapi password salah, apa yang biasanya dilakukan?","a":[["Memasukkan password lagi",35],["Memeriksa password",25],["Menggunakan \"Lupa Password\"",20],["Memeriksa username/email",10],["Meminta bantuan",10]],"note":"Konsep: percabangan dan pengulangan."},{"r":3,"title":"BABAK 3 – REBUTAN","q":"Saat mencari barang yang hilang di kamar, apa yang biasanya dilakukan?","a":[["Mengingat tempat terakhir melihat barang",35],["Mencari di meja",25],["Mencari di tas",20],["Mencari di tempat tidur",10],["Bertanya kepada orang lain",10]],"note":"Konsep: algoritma pencarian. Guru dapat mengaitkan: “Ternyata mencari barang juga memiliki algoritma. Kita menentukan langkah pencarian agar tidak mencari secara acak.”"},{"r":3,"title":"BABAK 3 – REBUTAN","q":"Ketika HP hampir habis baterai, apa yang biasanya kamu lakukan?","a":[["Mengisi daya",40],["Mencari charger",25],["Menghemat penggunaan HP",15],["Mengaktifkan mode hemat baterai",10],["Meminjam charger",10]],"note":"Konsep: algoritma pemecahan masalah."},{"r":3,"title":"BABAK 3 – REBUTAN","q":"Ketika akan membeli barang secara online, apa yang biasanya kamu lakukan terlebih dahulu?","a":[["Mencari barang",30],["Membandingkan harga",25],["Membaca ulasan",20],["Mengecek rating toko",15],["Mengecek ongkir",10]],"note":"Konsep: urutan langkah + pengambilan keputusan."},{"r":3,"title":"BABAK 3 – REBUTAN","q":"Saat ingin mengirim tugas melalui Google Classroom/WhatsApp, langkah apa yang biasanya dilakukan?","a":[["Membuka aplikasi",25],["Memilih tugas/chat",25],["Memilih file",20],["Mengunggah/mengirim file",20],["Mengecek apakah sudah terkirim",10]],"note":"Konsep: algoritma prosedural."},{"r":4,"title":"BABAK 4 – DOUBLE POINT","q":"Saat akan pergi ke suatu tempat yang belum pernah kamu kunjungi, apa yang biasanya dilakukan?","a":[["Membuka Google Maps",35],["Menentukan lokasi tujuan",25],["Memilih rute",20],["Melihat jarak/waktu",10],["Mengikuti petunjuk arah",10]],"note":"Konsep: algoritma pencarian rute."},{"r":4,"title":"BABAK 4 – DOUBLE POINT","q":"Ketika memasak nasi menggunakan rice cooker, apa saja langkah yang biasanya dilakukan?","a":[["Menyiapkan beras",25],["Mencuci beras",25],["Menambahkan air",20],["Memasukkan ke rice cooker",15],["Menekan tombol memasak",15]],"note":"Konsep: sequence."},{"r":4,"title":"BABAK 4 – DOUBLE POINT","q":"Ketika ingin memilih pakaian untuk pergi, apa yang biasanya dipertimbangkan?","a":[["Cuaca",30],["Tempat tujuan",25],["Kenyamanan",20],["Warna/model",15],["Kesesuaian dengan kegiatan",10]],"note":"Konsep: algoritma pengambilan keputusan."},{"r":5,"title":"BABAK 5 – FINAL 100","q":"Kamu sudah siap berangkat sekolah, tetapi tiba-tiba hujan deras. Apa langkah yang paling mungkin kamu lakukan?","a":[["Mengambil payung/jas hujan",35],["Mengecek kondisi hujan",25],["Menunggu hujan reda",20],["Menghubungi sekolah jika terlambat",10],["Tetap berangkat dengan perlengkapan hujan",10]],"note":"Konsep: percabangan + pengambilan keputusan."},{"r":5,"title":"BABAK 5 – FINAL 100","q":"Kamu mendapat tugas membuat presentasi. Bagaimana urutan kegiatan yang biasanya dilakukan?","a":[["Memahami tugas",30],["Mencari informasi",25],["Membuat materi",20],["Membuat slide",15],["Memeriksa dan memperbaiki",10]],"note":"Konsep: algoritma penyelesaian masalah."},{"r":5,"title":"BABAK 5 – FINAL 100","q":"Jika kamu ingin menyelesaikan masalah sehari-hari dengan cara yang teratur, apa yang sebaiknya dilakukan?","a":[["Memahami masalah",30],["Menentukan tujuan",25],["Menyusun langkah-langkah",20],["Melaksanakan langkah",15],["Mengevaluasi hasil",10]],"note":"Ini bisa menjadi pertanyaan penutup karena secara tidak langsung siswa menemukan sendiri konsep dasar algoritma."}];const GROUPS=['Kelompok 1','Kelompok 2','Kelompok 3','Kelompok 4','Kelompok 5'];let db,ref,code='',me=JSON.parse(localStorage.getItem('survey100_student')||'null'),state;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);function cfgOk(){const c=window.FAMILY100_FIREBASE_CONFIG;return c&&c.apiKey&&c.databaseURL&&c.projectId&&!/ISI_|GANTI|\.\.\./i.test(c.apiKey+c.databaseURL+c.projectId)}function join(){if(!db){$('status').textContent='Firebase masih menghubungkan…';return}code=$('code').value.trim().toUpperCase();const name=$('name').value.trim()||'Siswa';const g=Number(document.querySelector('input[name=group]:checked')?.value||0);if(!code)return;me={name,g,code};localStorage.setItem('survey100_student',JSON.stringify(me));ref=db.ref('rooms/'+code);ref.on('value',s=>{state=s.val();render()});$('join').classList.add('hidden');$('game').classList.remove('hidden')}function submit(text){if(!state||!me)return;const p='answers/g'+me.g;ref.child(p).set({text:String(text||'').trim(),name:me.name,at:firebase.database.ServerValue.TIMESTAMP})}function rebut(){if(!state||state.round!==3)return;ref.child('rebutRequests').push({group:me.g,name:me.name,at:firebase.database.ServerValue.TIMESTAMP})}function render(){if(!state)return;$('status').textContent=state.status==='finished'?'PERMAINAN SELESAI':'Terhubung • '+code;$('round').textContent=state.round?(['','BABAK 1 – PEMANASAN','BABAK 2 – TANTANGAN CEPAT','BABAK 3 – REBUTAN','BABAK 4 – DOUBLE POINT','BABAK 5 – FINAL 100'][state.round]):'MENUNGGU';const q=state.q>=0?QUESTIONS[state.q]:null;$('question').textContent=q?q.q:'Menunggu guru…';$('timer').textContent=state.timerDuration?Math.max(0,state.timerDuration-Math.floor((Date.now()-(state.timerStartedAt||Date.now()))/1000)):'—';$('score').textContent=(state.scores||[])[me.g]||0;$('answers').innerHTML=q?q.a.map((a,i)=>`<div class="ans ${state.opened&&state.opened[i]?'open':''}"><b>${i+1}</b>${state.opened&&state.opened[i]?esc(a[0])+' — '+(a[1]*(state.round===4?2:1))+' poin':'JAWABAN TERSEMBUNYI'}</div>`).join(''):'';const my=(state.answers||{})['g'+me.g];$('mine').textContent=my?.text?'Jawaban terkirim: '+my.text:'Belum mengirim jawaban';$('rebut').classList.toggle('hidden',state.round!==3||state.status!=='playing');clearTimeout(window.t);if(state.timerStartedAt&&state.timerDuration&&state.status==='playing')window.t=setTimeout(render,250)}if(!cfgOk())$('status').textContent='Firebase belum dikonfigurasi. Periksa firebase-config.js.';else{(async()=>{try{if(!firebase.apps.length)firebase.initializeApp(window.FAMILY100_FIREBASE_CONFIG);$('status').textContent='Menghubungkan ke Firebase…';const auth=firebase.auth();if(!auth.currentUser)await auth.signInAnonymously();db=firebase.database();$('status').textContent='Firebase siap • Masukkan kode ruang.';}catch(e){console.error(e);$('status').textContent='Firebase gagal: '+(e.code||'')+' '+(e.message||e)}})()}if(me&&me.code){$('code').value=me.code;$('name').value=me.name;$('g'+me.g).checked=true}window.join=join;window.submit=submit;window.rebut=rebut;</script></body></html>
