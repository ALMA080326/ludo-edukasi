function endGame(){S.busy=true;const r=[0,1,2,3].filter(i=>!S.fin.includes(i)).sort((a,b)=>S.ok[b]-S.ok[a]);if(S.ok[r[0]]==S.ok[r[1]])return tie(r);fin2([...S.fin,...r])}
function tie(r,round=0){const it=ask(Q.R);if(!it){return fin2([...S.fin,...r])}const res=[];const go=k=>{if(k>1)return judge();show(it,30,`🔥 SOAL REBUTAN - PENENTU JUARA<br>${G[r[k]].n} (${k+1}/2)`,(sel,t)=>{const ok=sel===it.a;S.h[r[k]].push({q:it.q,o:it.o,sel,a:it.a,ok,t,lv:"Rebutan"});res.push({ok,t});modal(`<div class="pse">${G[r[k]].n} sudah menjawab.</div><button class="btn" id="nx">${k<1?"Lanjut ke kelompok berikutnya 👉":"Lihat hasil 👉"}</button>`);$("nx").onclick=()=>go(k+1)})};
const judge=()=>{const[a,b]=res;let w=-1;if(a.ok&&!b.ok)w=0;else if(b.ok&&!a.ok)w=1;else if(a.ok&&b.ok)w=a.t<=b.t?0:1;if(w<0){modal(`<div class="pse">Keduanya belum tepat. Soal rebutan diganti!</div><button class="btn" id="nx">Soal baru 🔥</button>`);$("nx").onclick=()=>tie(r);return}
modal(`<div class="pse">${G[r[w]].n} unggul dan menjadi Juara 3! 🏆</div><button class="btn" id="nx">Lihat pemenang 👉</button>`);$("nx").onclick=()=>fin2([...S.fin,r[w],r[1-w]])};go(0)}
function fin2(o){S.over=true;draw();music(0);modal(`<h1 style="text-align:center">🏆 PERMAINAN SELESAI</h1><table><tr><th>Peringkat</th><th>Kelompok</th><th>Benar</th><th>Poin guru</th></tr>`+o.map((g,i)=>`<tr><td>${i==0?"Juara 1 (Pertama Finish)":i==1?"Juara 2":i==2?"Juara 3":"Peserta lainnya"}</td><td style="color:${G[g].c=="#ffd800"?"#ffd34d":"#fff"}">${G[g].n}</td><td>${S.ok[g]}</td><td>${RUB[i]}</td></tr>`).join("")+`</table><div class="note">Rubrik penilaian untuk guru: 100 / 90 / 80 / 70 poin. Jika kelompok yang belum finish seri pada jumlah jawaban benar, soal rebutan menentukan Juara 3.</div><button class="btn" onclick="review(0)">📖 Tinjau jawaban</button> <button class="btn" onclick="location.reload()">MAIN LAGI</button>`)}
function review(t){modal(`<h2>Mode review</h2><div class="tabs">`+G.map((g,i)=>`<button class="${i==t?"a":""}" onclick="review(${i})">${g.n} (${S.ok[i]}/${S.h[i].length})</button>`).join("")+`</div>`+(S.h[t].map((x,n)=>`<div class="rv ${x.ok?"ok":"no"}"><b>${n+1}. [${x.lv}] ${esc(x.q)}</b><br>Jawaban kelompok: ${x.sel===null?"(waktu habis)":esc(x.o[x.sel])}<br>Kunci: ${esc(x.o[x.a])} · ${Math.round(x.t)} detik</div>`).join("")||"<p>Belum ada jawaban.</p>")+`<button class="btn" onclick="fin2([...S.fin,...[0,1,2,3].filter(i=>!S.fin.includes(i)).sort((a,b)=>S.ok[b]-S.ok[a])])">⬅ Kembali</button>`)}
draw();modal(`<h2>📖 PANDUAN BERMAIN</h2><p class="note">1. Perwakilan kelompok klik dadu di tengah papan untuk memunculkan soal.<br>2. Pilih jawaban lalu klik "JAWAB SEKARANG". Timer 60 detik berjalan sejak soal muncul.<br>3. Makin cepat jawab benar, makin jauh melangkah: ≤5 dtk = 6 langkah, ≤10 = 5, ≤20 = 4, ≤30 = 3, ≤45 = 2, lebih dari 45 = 1.<br>4. Jawaban salah = pion tetap di tempat. Soal yang sudah muncul tidak akan muncul lagi.<br>5. Pion yang berhenti di petak lawan membuat lawan mundur 1 langkah, kecuali di petak bintang dan start.<br>6. Kelompok yang FINISH dapat ucapan selamat dan tidak mendapat soal lagi. Permainan berakhir setelah Juara 1 dan 2 FINISH.<br>7. 🔥 Soal Rebutan muncul jika dua kelompok sisa punya jawaban benar yang sama.</p><button class="btn" onclick="modal('');ac()">Mengerti, Mulai Main! 🎲</button>`);
</script></body></html>
